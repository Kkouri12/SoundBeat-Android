<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Sound Beat</title>
<style>
:root{--a:#b46cff;--bg:#000;--fg:#fff;--mut:rgba(255,255,255,.55);--line:rgba(255,255,255,.09);--card:#16161a;--glass:rgba(38,38,44,.72);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font:15px/1.3 -apple-system,"SF Pro Display","Inter",Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- shell ---------- */
#page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 14px) 0 200px;scrollbar-width:none}
#page::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;min-height:52px}
.hd h1{font-size:34px;font-weight:800;letter-spacing:-.5px}
.hd .grp{display:flex;gap:8px}
.cbtn{width:42px;height:42px;border-radius:50%;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;font-size:19px;border:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;object-fit:cover}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 18px 10px}
.sec h2{font-size:21px;font-weight:700}
.sec button{color:var(--a);font-size:14px}
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:none;scroll-snap-align:start}
.tile{width:140px;text-align:left}
.tile .art{width:140px;height:140px;border-radius:14px}
.tile b{display:block;margin-top:8px;font-weight:600;font-size:14px}
.tile span{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.art{background:#25252c;position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.35);font-size:28px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.art img.on{opacity:1}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic>div{position:relative;overflow:hidden}
.pcard{width:150px;height:150px;border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;position:relative;overflow:hidden}
.pcard b{font-size:16px;font-weight:700;position:relative}
.pcard span{font-size:12px;opacity:.8;position:relative}
.pcard .ic{position:absolute;top:12px;left:12px;font-size:26px}

/* ---------- list rows ---------- */
.rows{padding:0 8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;width:100%;text-align:left}
.row:active{background:rgba(255,255,255,.07)}
.row .art{width:48px;height:48px;border-radius:8px;flex:none;font-size:20px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px}
.row .t span{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row .dur{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.row .more{width:34px;height:34px;display:grid;place-items:center;color:var(--mut);font-size:20px;flex:none}
.row.now .t b{color:var(--a)}
.nav-row{display:flex;align-items:center;gap:16px;padding:15px 18px;width:100%;font-size:18px;font-weight:500;text-align:left}
.nav-row>svg:first-child{font-size:22px;flex:none}
.nav-row .t{flex:1;min-width:0}
.nav-row small{color:var(--mut);font-size:13px;margin-left:8px;font-weight:400}
.nav-row>svg:last-child{color:var(--mut);font-size:16px}
.nav-row:active{background:rgba(255,255,255,.06)}
.actions{display:flex;gap:10px;padding:4px 18px 8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;color:var(--a)}
.empty{text-align:center;color:var(--mut);padding:48px 30px}
.empty .btn{margin-top:16px}
.btn{display:inline-block;background:#fff;color:#000;border-radius:999px;padding:11px 28px;font-weight:600}
.back{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}

/* ---------- stats cards ---------- */
.cards{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.stat{flex:none;width:calc(100vw - 80px);max-width:340px;height:170px;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden}
.stat .k{font-size:10.5px;letter-spacing:1.2px;opacity:.8;font-weight:600}
.stat .big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.stat .sub{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.9}
.stat .meta{display:flex;justify-content:space-between;align-items:flex-end}
.stat .meta div:last-child{text-align:right;font-size:11px;opacity:.8}
.stat .meta div:last-child b{display:block;font-size:15px;letter-spacing:.5px}
.stat .wave{position:absolute;top:14px;right:14px;font-size:26px;opacity:.85}

/* ---------- bottom bars ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(var(--sab) + 12px);z-index:20;pointer-events:none}
#bar>*{pointer-events:auto}
#mini{display:none;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 7px;margin-bottom:10px;position:relative;overflow:hidden}
#mini.on{display:flex}
#mini .art{width:40px;height:40px;border-radius:50%;flex:none;font-size:16px}
#mini .t{flex:1;min-width:0;text-align:left}
#mini .t b{display:block;font-size:14px;font-weight:600}
#mini .t span{display:block;font-size:12px;color:var(--mut)}
#mini button{width:38px;height:38px;display:grid;place-items:center;font-size:20px}
#mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--a);width:0}
#tabs{display:flex;gap:10px;align-items:center}
#tabs .pillnav{flex:1;display:flex;background:var(--glass);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--line);border-radius:999px;padding:5px}
#tabs .pillnav button,#tabs .sbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:999px;flex:1;font-size:10.5px;color:var(--mut);font-weight:600}
#tabs svg{font-size:21px}
#tabs .pillnav button.on{background:rgba(255,255,255,.16);color:#fff}
#tabs .sbtn{flex:none;width:58px;height:58px;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--line);justify-content:center}
#tabs .sbtn.on{color:#fff;background:rgba(255,255,255,.16)}

/* ---------- search ---------- */
.sbox{display:flex;align-items:center;gap:10px;margin:0 18px 10px;background:#1b1b20;border-radius:14px;padding:0 14px;height:46px}
.sbox input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.sbox svg{color:var(--mut);font-size:18px}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none}
#scrim.on{display:block}
#sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 12px);z-index:61;background:rgba(40,40,48,.92);backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid var(--line);border-radius:26px;padding:8px;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:75vh;overflow-y:auto}
#sheet.on{transform:none}
#sheet .sh-title{text-align:center;color:var(--mut);font-size:13px;padding:10px 12px 6px}
.mi{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;border-radius:14px;font-size:16px}
.mi:active{background:rgba(255,255,255,.08)}
.mi svg{font-size:20px;flex:none}
.mi.dim{color:var(--mut)}
.mi .r{margin-left:auto;color:var(--mut);font-size:13px}
.sep{height:1px;background:var(--line);margin:4px 14px}
.tin{width:calc(100% - 20px);margin:8px 10px;background:#111;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;font-size:16px}
.kv{padding:10px 16px;font-size:14px;display:flex;gap:14px;justify-content:space-between}
.kv span:first-child{color:var(--mut);flex:none}
.kv span:last-child{text-align:right;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 150px);transform:translateX(-50%) translateY(20px);background:rgba(50,50,58,.95);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:90;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- full player ---------- */
#pl{position:fixed;inset:0;z-index:50;background:#000;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;padding:calc(var(--sat) + 10px) 24px calc(var(--sab) + 16px)}
#pl.on{transform:none}
#plbg{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.7) brightness(.62);transform:scale(1.2);z-index:-1;transition:opacity .4s}
#plbg2{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 8px;flex:none}
#plmain{flex:1;min-height:0;display:flex;flex-direction:column}
#plart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
#plart .art{width:100%;max-width:min(80vw,380px);aspect-ratio:1;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);font-size:70px;transition:transform .35s}
#pl.paused #plart .art{transform:scale(.86)}
.ptitle{display:flex;align-items:center;gap:10px;margin-top:6px}
.ptitle .t{flex:1;min-width:0}
.ptitle b{display:block;font-size:22px;font-weight:700}
.ptitle span{display:block;font-size:17px;color:rgba(255,255,255,.62);margin-top:2px}
.rbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:17px;flex:none}
.rbtn.on{background:#fff;color:#000}
.lrow{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-weight:600;margin:16px 0 14px;font-size:15px;width:fit-content}
.seek{margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;outline:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.9) var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
.seek input[type=range]:active::-webkit-slider-thumb{width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4px}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:10px 26px 4px}
.ctl button{display:grid;place-items:center}
.ctl .sk{font-size:50px;color:rgba(255,255,255,.95)}
.ctl .pp{font-size:74px}
.ctl .sm{font-size:22px;color:rgba(255,255,255,.7)}
.ctl .sm.on{color:#fff}
.vol{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:rgba(255,255,255,.6);font-size:15px}
.vol input{flex:1}
.vol input[type=range]::-webkit-slider-runnable-track{height:5px}
.foot{display:flex;justify-content:space-around;padding:12px 0 2px;color:rgba(255,255,255,.7);font-size:22px}
.foot button{width:48px;height:40px;display:grid;place-items:center;border-radius:10px}
.foot button.on{background:rgba(255,255,255,.2);color:#fff}

/* lyrics inside player */
#plly{display:none;flex:1;min-height:0;flex-direction:column}
#pl.lyr #plly{display:flex}
#pl.lyr #plmain{display:none}
.lymini{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lymini .art{width:46px;height:46px;border-radius:8px;font-size:18px;flex:none}
.lymini .t{flex:1;min-width:0}
.lymini b{display:block;font-size:16px}
.lymini span{display:block;font-size:14px;color:rgba(255,255,255,.62)}
#lyb{flex:1;overflow-y:auto;scrollbar-width:none;padding:30vh 0;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
#lyb::-webkit-scrollbar{display:none}
.ln{font-size:29px;font-weight:800;line-height:1.28;margin:0 0 18px;color:rgba(255,255,255,.34);text-align:start;unicode-bidi:plaintext;transition:color .3s,transform .3s;transform-origin:left center;cursor:pointer}
.ln.cur{color:#fff}
.ln.past{color:rgba(255,255,255,.45)}
.ply{font-size:21px;font-weight:600;line-height:1.6;color:rgba(255,255,255,.9);white-space:pre-wrap;unicode-bidi:plaintext;text-align:start;margin-bottom:18px}
.lymsg{color:rgba(255,255,255,.6);text-align:center;margin-top:35vh}
.lysrc{font-size:12px;color:rgba(255,255,255,.55);padding:4px 0 0}

/* Sound Beat 2.0 visual merge: liquid glass, accessibility and share cards */
:root{--sb-accent:#c77dff;--sb-blur:24px;--sb-lyblur:0px;--sb-motion:1}
body{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--sb-accent) 24%,#100d18),#09070d 72%)}
.cbtn,.rbtn,.pillnav,.sbtn,#sheet,.ptitle,.lymini{backdrop-filter:blur(var(--sb-blur)) saturate(165%);-webkit-backdrop-filter:blur(var(--sb-blur)) saturate(165%)}
#pl{background:linear-gradient(160deg,color-mix(in srgb,var(--sb-accent) 35%,#21152d),rgba(34,20,48,.94));backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}
#plbg,#plbg2{filter:blur(42px) saturate(1.3);opacity:.42}
#lyb .ln{filter:blur(var(--sb-lyblur));transition:filter .35s,opacity .35s,transform .4s cubic-bezier(.2,.8,.2,1)}
#lyb .ln.cur{filter:none;transform:scale(1.025)}
#sb-settings{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 13px);right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);display:grid;place-items:center;box-shadow:0 8px 30px #0003}
#sb-settings svg{width:20px;height:20px}
#sb-panel{position:fixed;z-index:80;inset:0;background:#08060bd9;backdrop-filter:blur(18px);display:none;align-items:flex-end}
#sb-panel.open{display:flex;animation:sbFade .25s ease}
#sb-card{width:100%;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(145deg,rgba(75,48,91,.92),rgba(22,17,30,.97));border:1px solid #ffffff22;box-shadow:0 -20px 80px #0008;animation:sbUp .38s cubic-bezier(.2,.8,.2,1)}
#sb-card h2{font-size:24px;margin:0 0 18px}
.sb-group{padding:14px 0;border-top:1px solid #ffffff20}
.sb-group h3{font-size:14px;opacity:.7;margin:0 0 12px}
.sb-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;min-height:48px}
.sb-row label{font-size:14px}
.sb-row input[type=color]{width:46px;height:34px;border:0;background:none}
.sb-row input[type=range]{width:42%;accent-color:var(--sb-accent)}
.sb-row select,.sb-row button,.sb-action{background:#ffffff18;border:1px solid #ffffff24;border-radius:14px;padding:10px 13px;color:white;max-width:55%}
.sb-actions{display:flex;gap:9px;flex-wrap:wrap}
.sb-actions button{background:#ffffff18;border:1px solid #ffffff24;border-radius:14px;padding:11px 14px;color:#fff}
.sb-close{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;background:#fff;color:#21152d;font-weight:700}
#sb-share,#sb-editor{position:fixed;z-index:90;inset:0;background:#08060bf0;display:none;align-items:center;justify-content:center;padding:20px}
#sb-share.open,#sb-editor.open{display:flex;animation:sbFade .2s ease}
.sb-sharebox,.sb-editbox{width:min(100%,430px);max-height:90dvh;overflow:auto;border-radius:26px;padding:20px;background:linear-gradient(145deg,#442b55,#160f20);border:1px solid #ffffff25;box-shadow:0 25px 80px #0009}
.sb-sharebox canvas{display:block;width:min(100%,330px);height:auto;margin:16px auto;border-radius:18px;box-shadow:0 12px 35px #0008}
.sb-editbox textarea{width:100%;min-height:42dvh;background:#100d18;color:#fff;border:1px solid #ffffff2b;border-radius:16px;padding:14px;font:15px/1.8 inherit;resize:vertical}
.sb-sharebox button,.sb-editbox button{border:0;border-radius:14px;padding:12px 16px;background:#fff;color:#21152d;font-weight:700;margin:5px 4px 0 0}
.sb-sharebox .secondary,.sb-editbox .secondary{background:#ffffff1b;color:#fff}
@keyframes sbUp{from{transform:translateY(45px);opacity:.5}to{transform:none;opacity:1}}
@keyframes sbFade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}


#sb-full{position:fixed;z-index:85;inset:0;display:none;background:#130d1bdc;backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px);padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);overflow:hidden}
#sb-full.open{display:block;animation:sbFade .3s ease}
#sb-fullcard{height:100%;display:flex;flex-direction:column;gap:18px}
#sb-fullart{position:absolute;inset:0;z-index:-1;opacity:.24;filter:blur(48px) saturate(1.4);background:center/cover}
#sb-fulltext{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:20px 0;scrollbar-width:none}
#sb-fulltext .ln{font-size:clamp(25px,6vw,36px);font-weight:750;line-height:1.35;color:#fff;opacity:.28;filter:blur(.6px);transition:all .4s cubic-bezier(.2,.8,.2,1);text-align:start}
#sb-fulltext .ln.cur{opacity:1;filter:none;transform:scale(1.025);text-shadow:0 4px 24px #0007}

/* === Motion pack === */
@keyframes sbRise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sbPop{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sbBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes sbEq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes sbGlow{0%,100%{box-shadow:0 24px 60px rgba(0,0,0,.5)}50%{box-shadow:0 28px 80px rgba(255,255,255,.12)}}
.rows>.row,.hs>*{animation:sbRise .5s cubic-bezier(.2,.8,.2,1) both}
.rows>.row:nth-child(2),.hs>*:nth-child(2){animation-delay:.04s}
.rows>.row:nth-child(3),.hs>*:nth-child(3){animation-delay:.08s}
.rows>.row:nth-child(4),.hs>*:nth-child(4){animation-delay:.12s}
.rows>.row:nth-child(5),.hs>*:nth-child(5){animation-delay:.16s}
.rows>.row:nth-child(6),.hs>*:nth-child(6){animation-delay:.2s}
.rows>.row:nth-child(n+7),.hs>*:nth-child(n+7){animation-delay:.24s}
.row,.tile,#tabs button,#mini,#pl button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s}
.row:active,.tile:active,#tabs button:active,#pl button:active{transform:scale(.94)}
#mini:active{transform:scale(.985)}
#tabs .pillnav button.on svg,#tabs .sbtn.on svg{animation:sbPop .4s cubic-bezier(.2,.8,.2,1)}
#plart .art{transform:scale(.86)}
#pl.playing #plart .art{transform:scale(1);animation:sbGlow 3.6s ease-in-out infinite}
#pl.on #plart .art{transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.row.now .art::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.row.now .art::before{content:"";position:absolute;z-index:2;left:50%;top:50%;width:18px;height:14px;margin:-7px 0 0 -9px;background:

/* === Liquid Glass motion v2 (iOS-style springs) === */
:root{--ios:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.45,.64,1);--gl-hi:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}

/* ---------- persistent state ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const S={
  playlists:store.get('sb.playlists',[]),
  likes:store.get('sb.likes',[]),
  recent:store.get('sb.recent',[]),
  plays:store.get('sb.plays',{}),
  secs:store.get('sb.secs',0),
  since:store.get('sb.since',Date.now()),
  rep:store.get('sb.rep',0),
  shuf:store.get('sb.shuf',false)
};
store.set('sb.since',S.since);
const save=()=>{store.set('sb.playlists',S.playlists);store.set('sb.likes',S.likes);store.set('sb.recent',S.recent);store.set('sb.plays',S.plays);store.set('sb.secs',S.secs);store.set('sb.rep',S.rep);store.set('sb.shuf',S.shuf)};

/* ---------- library ---------- */
let songs=[],byPath=new Map(),folders=[],scanState='idle',scanErr='';
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const base=p=>p.split('/').pop();
const dirOf=p=>p.substring(0,p.lastIndexOf('/'));
function normSong(r){
  const f=base(r.path),ext=(f.split('.').pop()||'').toUpperCase();
  const t=(r.title&&r.title!=='<unknown>')?r.title:f.replace(/\.[^.]+$/,'');
  const a=(r.artist&&r.artist!=='<unknown>')?r.artist:'Unknown artist';
  return{p:r.path,id:r.id||0,aid:r.albumId||0,t,a,al:(r.album&&r.album!=='<unknown>')?r.album:'',d:r.dur||0,f:dirOf(r.path),ext,br:r.bitrate?Math.round(r.bitrate/1000):0,added:r.added||0};
}
function indexLib(list){
  songs=list;byPath=new Map(songs.map(s=>[s.p,s]));
  const m=new Map();
  for(const s of songs){if(!m.has(s.f))m.set(s.f,[]);m.get(s.f).push(s)}
  folders=[...m.entries()].map(([p,l])=>({p,name:base(p)||p,list:l.sort((x,y)=>x.t.localeCompare(y.t,undefined,{sensitivity:'base'}))}))
    .sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));
  // drop stale ids
  const ok=new Set(byPath.keys());
  S.recent=S.recent.filter(p=>ok.has(p));S.likes=S.likes.filter(p=>ok.has(p));
  S.playlists.forEach(pl=>pl.ids=pl.ids.filter(p=>ok.has(p)));
}
async function scanLib(){
  scanState='scanning';scanErr='';render();
  try{
    if(NATIVE){const r=await ML.scan();indexLib(r.songs.map(normSong))}
    else indexLib(demoSongs());
    scanState='done';
  }catch(e){scanState='error';scanErr=String(e&&e.message||e)}
  save();render();
}
function demoSongs(){

const artCache=new Map(),artQ=[];let artBusy=0;
const GRAD=['#5b2a86,#1e1b4b','#7a1f2b,#1b3a4b','#0f5132,#14213d','#8a4b08,#2b1055','#1d4e89,#0b132b','#6b2737,#2d1e2f','#2c5364,#0f2027'];

function artKey(s){return s.aid>0?'a'+s.aid:'s'+s.id}
function getArt(s){
  const k=artKey(s);
  if(artCache.has(k))return Promise.resolve(artCache.get(k));
  return new Promise(res=>{artQ.push({s,k,res});pump()});
}
function pump(){
  while(artBusy<3&&artQ.length){
    const j=artQ.shift();artBusy++;
    const done=u=>{artCache.set(j.k,u);artBusy--;j.res(u);pump()};
    if(!NATIVE){done(null);continue}
    ML.getArt({id:j.s.id,albumId:j.s.aid,path:j.s.p}).then(r=>done(r&&r.path?srcOf(r.path):null)).catch(()=>done(null));
  }
}

function makeDemoWav(){
  const sr=8000,n=sr*120,b=new Uint8Array(44+n),v=new DataView(b.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}

/* ---------- lyrics ---------- */
const LY={lines:null,plain:null,src:'',loading:false,song:null,idx:-1,off:0};
const cleanT=s=>String(s||'').replace(/[\(\[].*?[\)\]]/g,' ').replace(/official|lyrics?|video|audio|\bhd\b|\bhq\b/gi,' ').replace(/_+/g,' ').replace(/^\d+\s*[-.]?\s*/,'').replace(/\s+/g,' ').trim();
var _FA=/[\u0600-\u06FF]/g,_LT=/[A-Za-z]/g,_P9='۰۱۲۳۴۵۶۷۸۹';
function lyKind(x){const f=(x.match(_FA)||[]).length,e=(x.match(_LT)||[]).length;return f>e?'fa':(e?'en':(f?'fa':''))}
function lyNorm(x){
  x=String(x||'').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').replace(/[ \t\u00a0]+/g,' ').trim();
  const k=lyKind(x);
  if(/[\u0600-\u06FF]/.test(x))x=x.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u0660-\u0669]/g,d=>_P9[d.charCodeAt(0)-1632]);
  if(k==='fa')x=x.replace(/[0-9]/g,d=>_P9[d]).replace(/\?/g,'؟').replace(/,/g,'،').replace(/(^|\s)(ن?می)\s+(?=[\u0621-\u06CC])/g,'$1$2\u200c');
  else if(k==='en')x=x.replace(/^([a-z])/,c=>c.toUpperCase());
  return x;
}
function parseLRC(t){
  const out=[];
  for(const ln of t.split(/\r?\n/)){
    const m=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];if(!m.length)continue;
    const x=lyNorm(ln.replace(/\[[^\]]*\]/g,'').trim());
    for(const k of m)out.push({t:+k[1]*60+parseFloat(k[2]),x});
  }
  return out.sort((a,b)=>a.t-b.t);
}
async function jget(u){try{const r=await fetch(u,{headers:{'User-Agent':'SoundBeat/2.0'}});return r.ok?await r.json():null}catch(e){return null}}
async function lrclib(ar,t,d){
  const B='https://lrclib.net/api/',q=o=>new URLSearchParams(o).toString();
  const a=ar==='Unknown artist'?'':ar;
  if(a){
    const r=await jget(B+'get?'+q({artist_name:a,track_name:t,...(d?{duration:Math.round(d)}:{})}));
    if(r&&(r.syncedLyrics||r.plainLyrics))return{synced:r.syncedLyrics,plain:r.plainLyrics,src:'LRCLIB'};
  }
  for(const u of [a&&'search?'+q({track_name:t,artist_name:a}),'search?'+q({q:(a+' '+t).trim()}),'search?'+q({q:t})]){
    if(!u)continue;const l=await jget(B+u);
    if(Array.isArray(l)){const s=l.find(x=>x.syncedLyrics)||l.find(x=>x.plainLyrics);if(s)return{synced:s.syncedLyrics,plain:s.plainLyrics,src:'LRCLIB'}}
  }
  return null;
}
const ent=s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#x27;|&#39;|&apos;/g,"'").replace(/&nbsp;/g,' ');
async function genius(ar,t){
  try{
    const a=ar==='Unknown artist'?'':cleanT(ar);
    const r=await fetch('https://genius.com/api/search/song?per_page=5&q='+encodeURIComponent((a+' '+cleanT(t)).trim()));
    if(!r.ok)return null;
    const hits=((await r.json()).response.sections||[]).flatMap(s=>s.hits||[]);
    const url=hits[0]&&hits[0].result&&hits[0].result.url;if(!url)return null;
    const h=await (await fetch(url)).text();
    const parts=[...h.matchAll(/<div[^>]*data-lyrics-container="true"[^>]*>([\s\S]*?)<\/div>/g)].map(x=>x[1]);
    const txt=ent(parts.join('\n').replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'')).trim();
    return txt.length>20?{plain:txt,src:'Genius'}:null;
  }catch(e){return null}
}
async function lyricsFor(s,force){
  LY.song=s;LY.lines=null;LY.plain=null;LY.src='';LY.idx=-1;LY.loading=true;
  LY.off=store.get('sb.off.'+s.p,0);renderLyrics();
  const ck='sb.ly.'+s.p;let c=force?null:store.get(ck,null);
  if(!c){
    const t=cleanT(s.t)||s.t;
    let r=NATIVE?await lrclib(s.a,t,s.d):{synced:window.demoLRC(s),src:'Demo'};
    if(!r||!r.synced){const g=await genius(s.a,t);if(g)r=r&&r.plain?r:g}
    if(r){c={synced:r.synced||null,plain:r.plain||null,src:r.src||''};if(localStorage.getItem('sb2.lysave')!=='false')store.set(ck,c)}
  }
  if(LY.song!==s)return;
  LY.loading=false;
  if(c){LY.lines=c.synced?parseLRC(c.synced):null;LY.plain=c.plain||null;LY.src=c.src||''}
  renderLyrics();
}
function renderLyrics(){
  const b=$('#lyb');$('#lySrc').textContent=LY.src?'Lyrics by '+LY.src:'';
  $('#pLyBtn').innerHTML=I.note+' Lyrics '+I.chev.replace('<svg','<svg style="width:13px;height:13px"');
  if(LY.loading){b.innerHTML='<div class="lymsg">Searching lyrics…</div>';return}
  if(LY.lines&&LY.lines.length){
    let nf=0,ne=0;LY.lines.forEach(l=>{const k=lyKind(l.x);k==='fa'?nf++:k==='en'&&ne++});b.dataset.dom=nf>ne?'fa':'en';
    b.innerHTML=LY.lines.map((l,i)=>`<div class="ln ${lyKind(l.x)}" data-i="${i}" dir="auto">${esc(l.x)||'♪'}</div>`).join('');
    LY.idx=-1;lyricTick(au.currentTime,true);
  }else if(LY.plain){const pl=LY.plain.split(/\r?\n/).map(lyNorm);let nf=0,ne=0;pl.forEach(l=>{const k=lyKind(l);k==='fa'?nf++:k==='en'&&ne++});b.dataset.dom=nf>ne?'fa':'en';b.innerHTML=`<div class="ply" dir="auto">${esc(pl.join('\n'))}</div>`}
  else b.innerHTML='<div class="lymsg">No lyrics found</div>';
}
function lyricTick(t,force){
  if(!LY.lines||!LY.lines.length)return;
  if(!$('#pl').classList.contains('lyr')&&!force)return;
  t=t+LY.off/1000+.15;
  let lo=0,hi=LY.lines.length-1,idx=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(LY.lines[m].t<=t){idx=m;lo=m+1}else hi=m-1}
  if(idx===LY.idx&&!force)return;LY.idx=idx;
  const els=$$('#lyb .ln');
  els.forEach((e,i)=>{e.classList.toggle('cur',i===idx);e.classList.toggle('past',i<idx)});
  els.forEach((x,i)=>x.style.setProperty('--k',Math.abs(i-idx)));
  const e=els[idx];if(e){const b=$('#lyb');lyGo(b,e.offsetTop+e.offsetHeight/2-b.clientHeight*.36,force)}
}
let lyA=0,lyT=0;
let lyV=0;
function lyGo(b,y,now){
  lyT=Math.max(0,Math.min(y,b.scrollHeight-b.clientHeight));
  if(now){cancelAnimationFrame(lyA);lyA=0;lyV=0;b.scrollTop=lyT;return}
  if(lyA)return;
  let t0=performance.now(),x=b.scrollTop;lyV=0;
  const f=n=>{
    const dt=Math.min(.04,(n-t0)/1000);t0=n;const w=8,d=x-lyT;
    lyV+=(-w*w*d-2*w*lyV)*dt;x+=lyV*dt;b.scrollTop=x;
    if(Math.abs(lyT-x)<.4&&Math.abs(lyV)<4){b.scrollTop=lyT;lyA=0;lyV=0;return}
    lyA=requestAnimationFrame(f)
  };
  lyA=requestAnimationFrame(f)
}

const view={name:'home',arg:null,tab:'home'};
